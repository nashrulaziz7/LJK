<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Koreksi LJK Pro - SDIT Al-Kautsar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn.selected { background-color: #2563eb; color: white; border-color: #2563eb; }
        .table-header { background-color: #fde047; }
        .col-num { background-color: #e2e8f0; }
        .marker-error { border: 3px solid #ef4444; background: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">

    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <header class="text-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold">Koreksi LJK Pro</h1>
        </header>

        <!-- Menu -->
        <div id="menu-utama" class="space-y-4">
            <button onclick="showSection('input')" class="w-full p-6 bg-blue-600 text-white rounded-xl font-bold">Input Kunci Jawaban</button>
            <button onclick="showSection('scan-upload')" class="w-full p-6 bg-emerald-600 text-white rounded-xl font-bold">Upload Foto/Scan LJK</button>
            <button onclick="showSection('scan-camera')" class="w-full p-6 bg-indigo-600 text-white rounded-xl font-bold">Ambil Foto Kamera</button>
        </div>

        <!-- Section Input -->
        <div id="section-input" class="hidden space-y-4">
            <div id="grid-kunci" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            <button onclick="saveAndGoHome()" class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold">Simpan & Kembali</button>
        </div>

        <!-- Section Scan & Upload -->
        <div id="section-scan" class="hidden space-y-4 text-center">
            <div id="canvas-wrapper" class="relative inline-block w-full">
                <canvas id="canvas-ljk" class="w-full border rounded-lg"></canvas>
            </div>
            <input type="file" id="input-file" class="hidden" accept="image/*" onchange="handleImage(event)">
            <button id="btn-upload" class="hidden w-full bg-emerald-600 text-white py-4 rounded-lg font-bold">Mulai Koreksi</button>
            <button onclick="goHome()" class="text-slate-500 underline">Kembali</button>
        </div>
    </div>

    <script>
        let kunciJawaban = JSON.parse(localStorage.getItem('kunci_ljk')) || Array(30).fill(null);

        function goHome() {
            document.getElementById('menu-utama').classList.remove('hidden');
            document.getElementById('section-input').classList.add('hidden');
            document.getElementById('section-scan').classList.add('hidden');
        }

        function showSection(section) {
            document.getElementById('menu-utama').classList.add('hidden');
            if (section === 'input') {
                document.getElementById('section-input').classList.remove('hidden');
                renderKeyGrid();
            } else {
                document.getElementById('section-scan').classList.remove('hidden');
                if (section === 'scan-upload') document.getElementById('input-file').click();
                else activateCamera();
            }
        }

        function renderKeyGrid() {
            const container = document.getElementById('grid-kunci');
            container.innerHTML = '';
            for (let col = 0; col < 3; col++) {
                const colDiv = document.createElement('div');
                colDiv.innerHTML = `<div class="text-center font-bold mb-2">Kolom ${col + 1}</div>`;
                for (let row = 0; row < 10; row++) {
                    const idx = (col * 10) + row;
                    colDiv.innerHTML += `<div class="flex items-center gap-2 mb-1">
                        <span class="w-6 text-xs">${idx + 1}</span>
                        ${['A','B','C','D'].map(o => `<button onclick="setKey(${idx}, '${o}')" class="w-7 h-7 border rounded ${kunciJawaban[idx] === o ? 'bg-blue-600 text-white' : ''}">${o}</button>`).join('')}
                    </div>`;
                }
                container.appendChild(colDiv);
            }
        }

        function setKey(idx, val) {
            kunciJawaban[idx] = val;
            renderKeyGrid();
        }

        function saveAndGoHome() {
            localStorage.setItem('kunci_ljk', JSON.stringify(kunciJawaban));
            goHome();
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas-ljk');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    document.getElementById('btn-upload').classList.remove('hidden');
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        function activateCamera() {
            // Simulasi akses kamera
            alert("Kamera diaktifkan. Harap arahkan pada LJK.");
            // Implementasi stream video ke canvas...
        }
    </script>
</body>
</html>

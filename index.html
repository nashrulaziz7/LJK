<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koreksi LJK AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-btn.selected { background-color: #2563eb; color: white; border-color: #1d4ed8; }
        .canvas-container { position: relative; overflow: hidden; width: 100%; height: 60vh; background: #e2e8f0; cursor: move; touch-action: none; }
        #canvas-ljk { transform-origin: 0 0; cursor: move; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <div id="app" class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-xl">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800">Koreksi LJK AI Pro</h1>
            <p class="text-slate-500 text-sm">Integrasi Gemini Vision AI</p>
        </header>

        <!-- Menu -->
        <div id="menu-utama" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <button onclick="showSection('input')" class="p-6 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">1. Input Kunci Jawaban</button>
            <button onclick="showSection('scan')" class="p-6 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700">2. Upload/Scan LJK</button>
        </div>

        <!-- Section: Input Kunci -->
        <div id="section-input" class="hidden">
            <div id="grid-kunci" class="grid grid-cols-2 md:grid-cols-5 gap-2 mb-6"></div>
            <button onclick="saveAndGoHome()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Simpan Kunci</button>
        </div>

        <!-- Section: Scan -->
        <div id="section-scan" class="hidden">
            <div class="flex gap-2 mb-4">
                <button onclick="document.getElementById('file-upload').click()" class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm">Upload File</button>
                <button onclick="startCamera()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">Kamera</button>
            </div>
            <input type="file" id="file-upload" class="hidden" accept="image/*" onchange="handleFile(event)">
            
            <div class="canvas-container" id="canvas-wrapper">
                <canvas id="canvas-ljk"></canvas>
            </div>

            <div id="action-buttons" class="hidden mt-4 flex gap-2">
                <button id="btn-analisis" onclick="analyzeLJK()" class="flex-1 bg-emerald-600 text-white py-3 rounded-lg font-bold">Analisis Pakai AI</button>
                <button onclick="goHome()" class="flex-1 bg-red-500 text-white py-3 rounded-lg font-bold">Reset</button>
            </div>
            <div id="status-ai" class="hidden mt-2 text-center text-blue-600 font-bold flex items-center justify-center gap-2">
                <div class="loader"></div> Sedang menganalisis jawaban dengan AI...
            </div>
        </div>
    </div>

    <script>
        let kunciJawaban = JSON.parse(localStorage.getItem('kunci_ljk')) || Array(30).fill(null);
        let scale = 1, posX = 0, posY = 0;

        // --- Render UI ---
        function renderKeyGrid() {
            const container = document.getElementById('grid-kunci');
            container.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                container.innerHTML += `
                    <div class="p-2 border rounded text-center">
                        <span class="block font-bold text-xs">${i + 1}</span>
                        <div class="flex justify-center gap-1 mt-1">
                            ${['A','B','C','D'].map(o => `
                                <button onclick="setKey(${i}, '${o}')" class="w-6 h-6 rounded border text-[10px] ${kunciJawaban[i] === o ? 'bg-blue-600 text-white' : ''}">${o}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- Logic AI Koreksi ---
        async function analyzeLJK() {
            const status = document.getElementById('status-ai');
            const canvas = document.getElementById('canvas-ljk');
            status.classList.remove('hidden');
            
            const imageData = canvas.toDataURL("image/jpeg", 0.8).split(',')[1];
            
            const prompt = `Anda adalah korektor LJK. Lihat gambar ini. Identifikasi jawaban siswa (A, B, C, atau D) untuk nomor 1 sampai 30. Bandingkan dengan kunci jawaban berikut: ${JSON.stringify(kunciJawaban)}.
            Berikan output JSON dengan format: {"score": number, "results": [{"no": number, "jawaban_siswa": string, "isCorrect": boolean}]}
            Jawab hanya dengan JSON.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{text: prompt}, {inlineData: {mimeType: "image/jpeg", data: imageData}}] }]
                    })
                });

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                const result = JSON.parse(jsonText);
                
                drawResults(result);
                alert("Skor Siswa: " + result.score);
            } catch (e) {
                alert("Gagal analisis AI: " + e.message);
            } finally {
                status.classList.add('hidden');
            }
        }

        function drawResults(result) {
            const canvas = document.getElementById('canvas-ljk');
            const ctx = canvas.getContext('2d');
            ctx.font = "20px Arial";
            result.results.forEach((res, i) => {
                ctx.fillStyle = res.isCorrect ? 'green' : 'red';
                ctx.fillText(res.isCorrect ? '✔' : '✘ ' + res.jawaban_siswa, 50 + (i%10)*50, 100 + Math.floor(i/10)*50);
            });
        }

        // --- Utils (File/Camera/Zoom) ---
        function setKey(idx, val) { kunciJawaban[idx] = val; localStorage.setItem('kunci_ljk', JSON.stringify(kunciJawaban)); renderKeyGrid(); }
        function showSection(s) { document.getElementById('menu-utama').classList.add('hidden'); document.getElementById('section-input').classList.toggle('hidden', s!=='input'); document.getElementById('section-scan').classList.toggle('hidden', s!=='scan'); if(s==='input') renderKeyGrid(); }
        function goHome() { window.location.reload(); }
        function saveAndGoHome() { localStorage.setItem('kunci_ljk', JSON.stringify(kunciJawaban)); goHome(); }
        
        function handleFile(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas-ljk');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    document.getElementById('action-buttons').classList.remove('hidden');
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        }

        async function startCamera() {
             const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
             const video = document.createElement('video');
             video.srcObject = stream;
             video.onloadedmetadata = () => {
                 video.play();
                 const canvas = document.getElementById('canvas-ljk');
                 canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                 canvas.getContext('2d').drawImage(video, 0, 0);
                 document.getElementById('action-buttons').classList.remove('hidden');
                 stream.getTracks().forEach(t => t.stop());
             };
        }
    </script>
</body>
</html>
